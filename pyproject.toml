[project]
name = "wavefront-local"
version = "0.1.4"
description = "Wavefront alignment for the local alignment scope."
readme = "README.md"
authors = [
    { name = "ljw", email = "ljw2017@sjtu.edu.cn" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.3",
]

[tool.scikit-build]
cmake.build-type = "Release"
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "cpp/src/**/*.{h,c,hpp,cpp}" },
    { file = "src/wavefront_local/bindings.cpp" },
    { file = "CMakeLists.txt"},
]

[build-system]
requires = ["scikit-build-core>=0.12.2", "pybind11>=3.0.4"]
build-backend = "scikit_build_core.build"

[dependency-groups]
dev = [
    "cibuildwheel>=4.1.0",
    "tqdm>=4.68.4",
    "jinja2>=3.1.6",
    "kaleido>=1.5.0",
    "plotly>=7.1.0",
    "ont-fast5-api>=4.1.3",
    "pod5>=0.3.49",
    "setuptools<=80.10.2",
    "pysam>=0.24.1",
    "py2bit>=1.0.1",
    "biopython>=1.88",
    "sh>=2.4.0",
]
